name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.22'

    - name: Download dependencies
      run: go mod download

    - name: Build binaries
      run: chmod +x ./build.sh && ./build.sh

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: Release ${{ github.ref_name }}
        prerelease: true
        files: |
          sq-linux-amd64
          sq-linux-arm64
          sq-darwin-amd64
          sq-darwin-arm64
          sq-windows-amd64.exe
